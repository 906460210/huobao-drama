# 火宝短剧增强版：从当前源码构建，只供本机访问。
# 公网部署须先配置覆盖页面、API、/static 的 TLS 反向代理认证。
services:
  app:
    image: huobao-drama-enhanced:local
    build:
      context: .
      args:
        HUOBAO_VERSION: ${HUOBAO_VERSION:-dev}
    ports:
      - "127.0.0.1:5679:5679"
    environment:
      HUOBAO_BIND_HOST: "0.0.0.0"
    volumes:
      - huobao-data:/app/data
    restart: unless-stopped

volumes:
  huobao-data:
